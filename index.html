<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mundo Baking JM — Insumos para panadería, repostería y cafetería en Colombia.">
<title>Mundo Baking JM | Catálogo de Insumos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* PALETA: header/hero Menta2 oscuro (elegante) + fondo Vainilla claro + Mocka como acento */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --chantilly:#FFFFFF;
  --vainilla:#F2E7DD;
  --vainilla-lt:#FAF6F2;
  --mocka:#92776F;
  --mocka-dk:#6e5850;
  --menta:#C9E8E1;
  --menta2:#8AA7A2;
  --menta2-dk:#5f837e;
  --menta2-xdk:#3d5f5a;
  --text:#2c2320;
  --muted:#9a8a84;
  --border:#e0d5cc;
  --r:12px;
}
html{scroll-behavior:smooth}
body{font-family:"DM Sans",sans-serif;background:var(--vainilla-lt);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}

/* HEADER */
.header{background:var(--menta2-xdk);padding:0 28px;display:flex;align-items:center;justify-content:space-between;height:68px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(61,95,90,.35)}
.logo-wrap{display:flex;align-items:center;gap:0}
.logo-img{height:42px;width:auto;object-fit:contain;filter:brightness(0) invert(1);opacity:.92}
.logo-text{display:flex;flex-direction:column;line-height:1.2}
.logo-name{font-family:"Playfair Display",serif;color:#FFFFFF;font-size:18px;font-weight:700;letter-spacing:-.2px}
.logo-sub{font-size:10px;font-weight:400;color:rgba(201,232,225,.82);letter-spacing:1.3px;text-transform:uppercase}
.cart-btn{background:#E8A020;border:none;color:#2c2320;padding:9px 20px;border-radius:8px;font-family:"DM Sans",sans-serif;font-weight:600;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .2s,transform .15s}
.cart-btn:hover{background:#d4901a;transform:translateY(-1px)}
.cart-count{background:#2c2320;color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.cart-count.bump{animation:bump .25s ease}
@keyframes bump{0%,100%{transform:scale(1)}50%{transform:scale(1.4)}}

/* HERO */
.hero{background:linear-gradient(160deg,var(--menta2-xdk) 0%,#2a504c 100%);padding:40px 24px 36px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Ccircle stroke='%23C9E8E1' stroke-width='0.5' stroke-opacity='0.08' cx='30' cy='30' r='20'/%3E%3C/g%3E%3C/svg%3E") repeat;opacity:.6}
.hero-content{position:relative;z-index:1}
.hero h1{font-family:"Playfair Display",serif;color:var(--chantilly);font-size:32px;font-weight:700;margin-bottom:8px;text-shadow:0 2px 16px rgba(0,0,0,.15)}
.hero p{color:rgba(201,232,225,.92);font-size:13px;margin-bottom:24px;letter-spacing:.4px}
.search-wrap{position:relative;max-width:560px;margin:0 auto}
.search-wrap input{width:100%;padding:15px 52px 15px 22px;border-radius:12px;border:none;font-family:"DM Sans",sans-serif;font-size:14px;background:var(--chantilly);color:var(--text);outline:none;box-shadow:0 6px 32px rgba(0,0,0,.2);transition:box-shadow .2s}
.search-wrap input:focus{box-shadow:0 6px 32px rgba(0,0,0,.26),0 0 0 3px rgba(138,167,162,.4)}
.search-wrap input::placeholder{color:#b8aea8}
.search-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--menta2);pointer-events:none}

/* FILTERS */
.filters{padding:13px 28px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:var(--chantilly);border-bottom:1px solid var(--border)}
.filters::-webkit-scrollbar{display:none}
.filter-btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 16px;border-radius:20px;font-family:"DM Sans",sans-serif;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;transition:all .2s;flex-shrink:0}
.filter-btn:hover{background:var(--menta);border-color:var(--menta2);color:var(--menta2-xdk)}
.filter-btn.active{background:var(--menta2-xdk);border-color:var(--menta2-xdk);color:var(--chantilly)}

/* STATS */
.stats-bar{padding:10px 28px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--border);background:var(--chantilly)}
.stats-bar strong{color:var(--menta2-xdk);font-weight:600}

/* LOADING */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;color:var(--muted);gap:14px;grid-column:1/-1}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--menta2);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;padding:22px 28px 120px}

/* CARDS */
.pcard{background:var(--chantilly);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:transform .22s,box-shadow .22s,border-color .18s;position:relative}
.pcard:hover{transform:translateY(-3px);box-shadow:0 10px 32px rgba(61,95,90,.12);border-color:var(--menta2)}
.pcard.in-cart{border-color:var(--menta2);box-shadow:0 0 0 2px rgba(138,167,162,.22)}
.img-wrap{aspect-ratio:1;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--vainilla-lt)}
.img-wrap img{width:100%;height:100%;object-fit:cover;position:absolute;top:0;left:0;display:block}
.img-placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:5px;position:absolute;top:0;left:0}
.sku-code{font-family:"Playfair Display",serif;font-size:26px;font-weight:700;opacity:.38}
.sku-num{font-size:10px;font-weight:500;opacity:.28;letter-spacing:1px}
.c-margarinas{background:#e8f3ee;color:#3d6e54}
.c-harinas{background:#f5eddf;color:#7a5520}
.c-abarrotes{background:var(--vainilla);color:var(--mocka-dk)}
.c-dulces{background:var(--menta);color:var(--menta2-xdk)}
.c-esencias{background:#f0e8f5;color:#7040a0}
.c-lacteos{background:#e5eef5;color:#305878}
.c-default{background:var(--vainilla-lt);color:var(--mocka)}
.c-reposteria{background:#f5e8f0;color:#7a3060}
.c-panaderia{background:#fdf0e2;color:#8a4a10}
.c-salsamentaria{background:#fde8e8;color:#8a2020}
.c-lacteos{background:#e5eef5;color:#305878}
.c-embutidos{background:#f5ebe8;color:#7a3820}
.c-productos-terminados{background:#e8ede5;color:#3a5830}
.cat-tag{position:absolute;top:8px;left:8px;background:rgba(61,95,90,.82);color:var(--menta);font-size:9px;font-weight:600;padding:3px 8px;border-radius:4px;letter-spacing:.5px;text-transform:uppercase;backdrop-filter:blur(4px)}
.add-quick{position:absolute;top:8px;right:8px;background:rgba(255,255,255,.92);border:1px solid var(--border);color:var(--menta2-xdk);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;line-height:1;cursor:pointer;opacity:0;font-weight:300;backdrop-filter:blur(4px);transition:all .2s}
.pcard:hover .add-quick{opacity:1}
.add-quick:hover{background:var(--menta2);color:var(--chantilly);border-color:var(--menta2);transform:scale(1.1)}
.pcard-body{padding:12px 14px 14px}

.pcard-name{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:6px;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.pcard-pres{font-size:11px;color:var(--muted);margin-bottom:8px;font-weight:400}
.price-detal{font-family:"Playfair Display",serif;font-size:18px;font-weight:700;color:var(--mocka-dk)}
.in-cart-pill{position:absolute;bottom:10px;right:10px;background:var(--menta2);color:var(--chantilly);font-size:9px;font-weight:600;padding:2px 9px;border-radius:10px;display:none;letter-spacing:.3px}
.pcard.in-cart .in-cart-pill{display:block}

/* EMPTY */
.empty{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--muted)}
.empty-icon{font-size:52px;margin-bottom:14px;opacity:.3}
.empty h3{font-family:"Playfair Display",serif;font-size:20px;color:var(--menta2-dk);margin-bottom:8px}

/* OVERLAY + DRAWER */
.overlay{position:fixed;inset:0;background:rgba(44,35,32,.4);z-index:199;opacity:0;pointer-events:none;transition:opacity .3s;backdrop-filter:blur(2px)}
.overlay.show{opacity:1;pointer-events:all}
.drawer{position:fixed;right:0;top:0;bottom:0;width:min(400px,100vw);background:var(--chantilly);z-index:200;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-6px 0 48px rgba(44,35,32,.18)}
.drawer.show{transform:none}
.drawer-head{background:var(--menta2-xdk);padding:20px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.drawer-head h2{font-family:"Playfair Display",serif;color:var(--menta);font-size:19px}
.drawer-close{background:none;border:1px solid rgba(201,232,225,.3);color:var(--menta);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.drawer-close:hover{background:rgba(201,232,225,.15)}
.drawer-body{flex:1;overflow-y:auto;padding:16px 20px}
.empty-cart{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-cart svg{opacity:.2}
.empty-cart p{font-size:14px;margin-top:12px;line-height:1.6}
.cart-item{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--border);animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ci-thumb{width:48px;height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:"Playfair Display",serif;font-size:12px;font-weight:700;flex-shrink:0}
.ci-info{flex:1;min-width:0}
.ci-name{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:2px}
.ci-sub{font-size:11px;color:var(--muted)}
.ci-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.ci-price{font-family:"Playfair Display",serif;font-size:15px;font-weight:700;color:var(--mocka-dk)}
.qty-ctrl{display:flex;align-items:center;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.qty-btn{background:var(--chantilly);border:none;width:30px;height:30px;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;color:var(--menta2-xdk);transition:background .15s}
.qty-btn:hover{background:var(--menta)}
.qty-num{font-size:13px;font-weight:600;width:28px;text-align:center}
.drawer-foot{padding:16px 20px 20px;border-top:1px solid var(--border);background:var(--chantilly);flex-shrink:0}
.sum-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.sum-row.total{font-size:15px;font-weight:600;color:var(--menta2-xdk);padding-top:10px;margin-top:6px;border-top:1px solid var(--border);margin-bottom:14px}
.sum-row.total .amount{font-family:"Playfair Display",serif;font-size:20px;font-weight:700}
.wa-btn{width:100%;background:#25d366;color:#fff;border:none;padding:15px;border-radius:10px;font-family:"DM Sans",sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:background .2s,transform .15s,box-shadow .2s}
.wa-btn:hover{background:#20bb5a;transform:translateY(-1px);box-shadow:0 6px 24px rgba(37,211,102,.35)}
.wa-note{text-align:center;font-size:11px;color:var(--muted);margin-top:8px}

@media(max-width:480px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 14px 120px}
  .hero h1{font-size:24px}
  .header{padding:0 16px;height:60px}
  .logo-img{height:34px}
  .filters,.stats-bar,.grid{padding-left:14px;padding-right:14px}
}
</style>
</head>

      Enviar pedido por WhatsApp
    </button>
    <p class="wa-note">Se abrirá WhatsApp con tu pedido listo para enviar</p>
  </div>
</aside>

  {sku:"DUL-007",name:"Arequipe La Carreta 4.8 KG",brand:"LA CARRETA",cat:"Dulces",pres:"4.8 KG",precio:51000,disponible:"SI",imagen:""},
  {sku:"DUL-009",name:"Arequipe La Bugueña 5 KG",brand:"LA BUGUEÑA",cat:"Dulces",pres:"5 KG",precio:65000,disponible:"SI",imagen:""},
  {sku:"DUL-037",name:"Arequipe Alpina 500 g",brand:"ALPINA",cat:"Dulces",pres:"500 g",precio:16200,disponible:"SI",imagen:""},
  {sku:"DUL-040",name:"Salsa Hersheys Fresa 623 g",brand:"M.B. DISTRIBUCIONES",cat:"Dulces",pres:"623 g",precio:23000,disponible:"SI",imagen:""},
  {sku:"DUL-041",name:"Salsa Hersheys Chocolate 680 g",brand:"M.B. DISTRIBUCIONES",cat:"Dulces",pres:"680 g",precio:23000,disponible:"SI",imagen:""},
  {sku:"DUL-044",name:"Crema Untable Milo 1 KG",brand:"ESTRENA LTDA",cat:"Dulces",pres:"1 KG",precio:76000,disponible:"SI",imagen:""},
];
const CAT_CLASS={Margarinas:"c-margarinas",Harinas:"c-harinas",Abarrotes:"c-abarrotes",Dulces:"c-dulces",Esencias:"c-esencias",Lacteos:"c-lacteos","Productos Terminados":"c-productos-terminados",Reposteria:"c-reposteria",Panaderia:"c-panaderia",Salsamentaria:"c-salsamentaria",Embutidos:"c-embutidos"};
let PRODUCTS=[],cart={},activeFilter="Todos",searchTerm="";
function catCls(c){return CAT_CLASS[c]||"c-default";}
function fmt(n){return"$"+Math.round(n).toLocaleString("es-CO");}
function parseCSV(text){
  const lines=text.trim().split("\n");
  const hdrs=lines[0].split(",").map(h=>h.trim().replace(/^"|"$/g,"").toLowerCase());
  return lines.slice(1).map(line=>{
    const cols=[];let cur="",inQ=false;
    for(const ch of line){if(ch==='"')inQ=!inQ;else if(ch===","&&!inQ){cols.push(cur.trim());cur="";}else cur+=ch;}
    cols.push(cur.trim());
    const o={};hdrs.forEach((h,i)=>{o[h]=(cols[i]||"").replace(/^"|"$/g,"").trim();});
    return{sku:o.sku||o.codigo||"",name:o.nombre||o.name||"",brand:o.marca||o.brand||"",cat:o.categoria||o.cat||"",pres:o.presentacion||o.pres||"",precio:parseFloat((o.precio||o.precio_detal||"0").replace(/[^0-9.]/g,""))||0,disponible:(o.disponible||"SI").toUpperCase(),imagen:o.imagen||o.imagen_url||""};
  }).filter(p=>p.sku&&p.disponible==="SI");
}
async function loadProducts(){
  if(SHEET_CSV_URL){
    // Método 1: fetch directo (funciona cuando el Sheet es público)
    try{
      const res=await fetch(SHEET_CSV_URL,{cache:"no-store"});
      if(res.ok){
        const text=await res.text();
        const parsed=parseCSV(text);
        if(parsed.length>0){PRODUCTS=parsed;console.log("✅ Sheets directo:",parsed.length,"productos");return;}
      }
    }catch(e){console.warn("Método directo falló:",e.message);}
    // Método 2: proxy allorigins
    try{
      const res=await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(SHEET_CSV_URL)}&timestamp=${Date.now()}`);
      const json=await res.json();
      const parsed=parseCSV(json.contents);
      if(parsed.length>0){PRODUCTS=parsed;console.log("✅ allorigins:",parsed.length,"productos");return;}
    }catch(e){console.warn("allorigins falló:",e.message);}
    // Método 3: proxy corsproxy.io
    try{
      const res=await fetch(`https://corsproxy.io/?${encodeURIComponent(SHEET_CSV_URL)}`);
      if(res.ok){
        const text=await res.text();
        const parsed=parseCSV(text);
        if(parsed.length>0){PRODUCTS=parsed;console.log("✅ corsproxy:",parsed.length,"productos");return;}
      }
    }catch(e){console.warn("corsproxy falló:",e.message);}
  }
  PRODUCTS=FALLBACK_PRODUCTS.filter(p=>p.disponible==="SI");
  console.warn("⚠️ Usando datos locales:",PRODUCTS.length,"productos");
}
function getFiltered(){return PRODUCTS.filter(p=>{const mc=activeFilter==="Todos"||p.cat===activeFilter;const q=searchTerm.toLowerCase().trim();const ms=!q||p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)||p.sku.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)||p.pres.toLowerCase().includes(q);return mc&&ms;});}
function renderFilters(){const cats=["Todos",...[...new Set(PRODUCTS.map(p=>p.cat))]];document.getElementById("filters").innerHTML=cats.map(c=>`<button class="filter-btn${c===activeFilter?" active":""}" onclick="setFilter('${c}')">${c}${c!=="Todos"?` <span style="opacity:.5;font-size:10px">(${PRODUCTS.filter(p=>p.cat===c).length})</span>`:""}</button>`).join("");}
function setFilter(cat){activeFilter=cat;renderFilters();renderGrid();}
function filterProducts(){searchTerm=document.getElementById("searchInput").value;renderGrid();}
function renderGrid(){
  const list=getFiltered(),grid=document.getElementById("productGrid");
  document.getElementById("statsBar").innerHTML=`Mostrando <strong>${list.length}</strong> de ${PRODUCTS.length} productos disponibles`;
  if(!list.length){grid.innerHTML='<div class="empty"><div class="empty-icon">🔍</div><h3>Sin resultados</h3><p>Intenta con otro término</p></div>';return;}
  grid.innerHTML=list.map(p=>{
    const ic=!!cart[p.sku],cc=catCls(p.cat),px=p.sku.split("-")[0];
    const img=p.imagen?`<img src="${p.imagen}" alt="${p.name}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`+`<div class="img-placeholder ${cc}" style="display:none"><div class="sku-code">${px}</div><div class="sku-num">${p.sku}</div></div>`:`<div class="img-placeholder ${cc}"><div class="sku-code">${px}</div><div class="sku-num">${p.sku}</div></div>`;
    return`<article class="pcard${ic?" in-cart":""}" id="card-${p.sku}"><div class="img-wrap ${cc}">${img}<div class="cat-tag">${p.cat}</div><button class="add-quick" onclick="quickAdd(event,'${p.sku}')">+</button></div><div class="pcard-body"><div class="pcard-name">${p.name}</div><div class="pcard-pres">${p.pres}</div><div class="price-detal">${fmt(p.precio)}</div></div><div class="in-cart-pill">En pedido</div></article>`;
  }).join("");
}
function quickAdd(e,sku){e.stopPropagation();const p=PRODUCTS.find(x=>x.sku===sku);if(!p)return;if(!cart[sku])cart[sku]={...p,qty:1};else cart[sku].qty++;document.getElementById("card-"+sku)?.classList.add("in-cart");const c=document.getElementById("cartCount");c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");updateCartUI();}
function changeQty(sku,delta){if(!cart[sku])return;cart[sku].qty=Math.max(0,cart[sku].qty+delta);if(cart[sku].qty===0){delete cart[sku];document.getElementById("card-"+sku)?.classList.remove("in-cart");}updateCartUI();}
function updateCartUI(){document.getElementById("cartCount").textContent=Object.values(cart).reduce((s,i)=>s+i.qty,0);renderDrawer();}
function renderDrawer(){
  const items=Object.values(cart),body=document.getElementById("drawerBody"),foot=document.getElementById("drawerFoot");
  if(!items.length){body.innerHTML='<div class="empty-cart"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg><p>Tu pedido está vacío.<br>Agrega productos con el botón <strong>+</strong>.</p></div>';foot.style.display="none";return;}
  const total=items.reduce((s,i)=>s+i.precio*i.qty,0),count=items.reduce((s,i)=>s+i.qty,0);
  body.innerHTML=items.map(i=>`<div class="cart-item"><div class="ci-thumb ${catCls(i.cat)}">${i.sku.split("-")[0]}</div><div class="ci-info"><div class="ci-name">${i.name}</div><div class="ci-sub">${i.brand} · ${i.pres}</div><div class="ci-bottom"><div class="ci-price">${fmt(i.precio*i.qty)}</div><div class="qty-ctrl"><button class="qty-btn" onclick="changeQty('${i.sku}',-1)">−</button><span class="qty-num">${i.qty}</span><button class="qty-btn" onclick="changeQty('${i.sku}',1)">+</button></div></div></div></div>`).join("");
  document.getElementById("sumItems").textContent=count+" ítem"+(count!==1?"s":"");
  document.getElementById("sumTotal").textContent=fmt(total);
  foot.style.display="block";
}
function toggleCart(){const d=document.getElementById("drawer"),o=document.getElementById("overlay"),open=d.classList.contains("show");d.classList.toggle("show",!open);o.classList.toggle("show",!open);document.body.style.overflow=open?"":"hidden";}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("drawer").classList.contains("show"))toggleCart();});
function sendWhatsApp(){const items=Object.values(cart);if(!items.length)return;const total=items.reduce((s,i)=>s+i.precio*i.qty,0);let msg="🍞 *Hola Mundo Baking JM*\nDeseo realizar el siguiente pedido:\n\n";items.forEach(i=>{msg+=`• ${i.name}\n  Cantidad: ${i.qty} · ${fmt(i.precio*i.qty)}\n`;});msg+=`\n*Total estimado: ${fmt(total)}*\n\nGracias. 🙏`;window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank","noopener,noreferrer");}
(async()=>{document.getElementById("productGrid").innerHTML='<div class="loading-wrap"><div class="spinner"></div><p style="font-size:13px;color:var(--muted)">Cargando productos...</p></div>';await loadProducts();renderFilters();renderGrid();renderDrawer();})();
</script>
